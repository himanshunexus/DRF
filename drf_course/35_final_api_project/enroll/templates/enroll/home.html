<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Enrollment CRUD</title></head>
<body><h1>Enrollment CRUD</h1>
<p>The HTML form and /api/crud/ use the same records.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Save</button></form>
<h2>Student information</h2><table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
<tbody>{% for record in records %}<tr><td>{{ record.id }}</td><td>{{ record.name }}</td><td>{{ record.email }}</td>
<td><a href="{% url 'enroll-edit' record.pk %}">Edit</a>
<form method="post" action="{% url 'enroll-delete' record.pk %}">{% csrf_token %}<button>Delete</button></form></td></tr>
{% empty %}<tr><td colspan="4">No records yet.</td></tr>{% endfor %}</tbody></table>
<a href="{% url 'enroll-home' %}">New record</a></body></html>
<!-- NOTES ABOUT THE COMPLETE CODE ABOVE
Django renders validated form fields and escapes displayed record values.
Every POST includes a CSRF token. Deletion is never triggered by following a GET link.
The table deliberately excludes passwords and password hashes.
This plain HTML layout is an original exercise, not a reproduction of the lecture's CSS.
-->
